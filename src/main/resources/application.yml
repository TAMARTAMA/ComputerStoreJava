spring:
  application:
    name: Computer Store Management API
  # Load a local .env (KEY=VALUE) when present so JWT_SECRET and related vars work without
  # manually exporting them. optional: keeps tests/CI starting when no .env exists.
  config:
    import: optional:file:.env[.properties]
  datasource:
    url: jdbc:mysql://${MYSQL_HOST:localhost}:${MYSQL_PORT:3306}/${MYSQL_DATABASE:computerstore}?createDatabaseIfNotExist=false&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
    username: ${MYSQL_USER:computerstore}
    password: ${MYSQL_PASSWORD:computerstore}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

app:
  security:
    jwt:
      # No fallback on purpose: the application must refuse to start without a real secret.
      secret: ${JWT_SECRET:}
      expiration: ${JWT_EXPIRATION:PT1H}
      issuer: computer-store-api

server:
  port: ${SERVER_PORT:8080}

logging:
  level:
    root: INFO
    com.tamar.computerstore: INFO
