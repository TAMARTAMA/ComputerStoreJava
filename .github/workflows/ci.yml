name: CI

on:
  push:
  pull_request:

jobs:
  verify:
    name: Maven verify (JDK 21)
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Make Maven Wrapper executable
        run: chmod +x mvnw

      # Testcontainers uses Docker on the GitHub-hosted runner; Surefire injects a throwaway
      # JWT_SECRET. No .env, production credentials, or external services are required.
      - name: Run tests
        run: ./mvnw clean verify
