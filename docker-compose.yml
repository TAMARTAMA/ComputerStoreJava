services:
  mysql:
    image: mysql:8.4
    container_name: computerstore-mysql
    restart: unless-stopped
    ports:
      - "${MYSQL_PORT:-3306}:3306"
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-rootpassword}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-computerstore}
      MYSQL_USER: ${MYSQL_USER:-computerstore}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-computerstore}
    volumes:
      - computerstore_mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-p${MYSQL_ROOT_PASSWORD:-rootpassword}"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s

volumes:
  computerstore_mysql_data:
