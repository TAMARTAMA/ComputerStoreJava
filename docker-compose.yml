services:
  mysql:
    image: mysql:8.4
    container_name: computerstore-mysql
    restart: unless-stopped
    ports:
      - "${MYSQL_PORT:-3306}:3306"
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-rootpassword}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-computerstore}
      MYSQL_USER: ${MYSQL_USER:-computerstore}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-computerstore}
    volumes:
      - computerstore_mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-p${MYSQL_ROOT_PASSWORD:-rootpassword}"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s

  # Optional API container. Default `docker compose up -d` still starts MySQL only.
  # Requires JWT_SECRET (and other vars) in the environment or .env — nothing is hardcoded here.
  #   docker compose --profile api up -d --build
  api:
    profiles: ["api"]
    build:
      context: .
      dockerfile: Dockerfile
    container_name: computerstore-api
    restart: unless-stopped
    ports:
      - "${SERVER_PORT:-8080}:8080"
    environment:
      MYSQL_HOST: mysql
      MYSQL_PORT: 3306
      MYSQL_DATABASE: ${MYSQL_DATABASE:-computerstore}
      MYSQL_USER: ${MYSQL_USER:-computerstore}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-computerstore}
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRATION: ${JWT_EXPIRATION:-PT1H}
      SERVER_PORT: 8080
    depends_on:
      mysql:
        condition: service_healthy

volumes:
  computerstore_mysql_data:
